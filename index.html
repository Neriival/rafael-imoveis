<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- Configurações principais -->
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!-- Título do site -->
    <title>
        Rafael Dantas | Imóveis em Praia Grande
    </title>


    <!-- Favicon -->

    <link
        rel="icon"
        href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%230f4946"/><text x="50" y="70" text-anchor="middle" font-family="Arial" font-size="60" font-weight="bold" fill="%23c6a05a">R</text></svg>'
    >



    <!-- Descrição para o Google -->
    <meta
        name="description"
        content="Encontre casas e apartamentos para comprar ou alugar em Praia Grande com atendimento personalizado do corretor Rafael."
    >


    <!-- Palavras relacionadas ao site -->
    <meta
        name="keywords"
        content="imóveis em Praia Grande, apartamentos em Praia Grande, casas em Praia Grande, corretor de imóveis, comprar apartamento, alugar apartamento"
    >


    <!-- Autor -->
    <meta
        name="author"
        content="Rafael Imóveis"
    >


    <!-- Permitir que o Google encontre o site -->
    <meta
        name="robots"
        content="index, follow"
    >


    <!-- Cor do navegador no celular -->
    <meta
        name="theme-color"
        content="#0f4946"
    >


    <!-- ============================
         COMPARTILHAMENTO
    ============================= -->

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:title"
        content="Rafael Imóveis | Praia Grande"
    >

    <meta
        property="og:description"
        content="Encontre o imóvel ideal em Praia Grande com atendimento personalizado."
    >

    <meta
        property="og:image"
        content="imagens/compartilhamento.jpg"
    >



    <!-- ============================
         ARQUIVOS CSS
    ============================= -->

    <link rel="stylesheet" href="css/global.css">

    <link rel="stylesheet" href="css/header.css">

    <link rel="stylesheet" href="css/apresentacao.css">

    <link rel="stylesheet" href="css/busca.css">

    <link rel="stylesheet" href="css/imoveis.css">

    <link rel="stylesheet" href="css/modal.css">

    <link rel="stylesheet" href="css/servicos.css">

    <link rel="stylesheet" href="css/contato.css">

    <link rel="stylesheet" href="css/footer.css">

    <link rel="stylesheet" href="css/whatsapp.css">

    <!-- O responsivo deve ficar por último -->

</head>

<body>

    <!-- O header será carregado aqui -->
    <div id="header"></div>

    <main>

        <!-- Apresentação do corretor -->
        <div id="apresentacao"></div>

        <!-- Busca de imóveis -->
        <div id="busca"></div>

        <!-- Cards dos imóveis -->
        <div id="imoveis"></div>

        <!-- Serviços do corretor -->
        <div id="servicos"></div>

        <!-- Rodapé contato -->
        <div id="contato"></div>

    </main>

    <!-- Modal com detalhes do imóvel -->
    <div id="modal-imovel"></div>

    <!-- Rodapé -->
    <div id="footer"></div>

    <!-- WhatsApp flutuante -->
    <div id="whatsapp-flutuante-container"></div>







    <script src="js/menu.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/imoveis.js"></script>
