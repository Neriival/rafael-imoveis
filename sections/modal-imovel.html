<!-- Fundo escuro do modal -->
<div class="modal-overlay" id="modal-overlay">

    <!-- Ficha do imóvel -->
    <div class="modal-imovel" id="modal-imovel-conteudo">

        <button
            class="modal-fechar"
            id="modal-fechar"
            type="button"
            aria-label="Fechar"
        >
            ×
        </button>

        <!-- Galeria -->
        <div class="modal-galeria">

            <div class="modal-imagem-principal">

                <img
                    id="modal-imagem"
                    src=""
                    alt="Foto do imóvel"
                >

                <button
                    class="seta-foto seta-anterior"
                    id="foto-anterior"
                    type="button"
                >
                    ‹
                </button>

                <button
                    class="seta-foto seta-proxima"
                    id="proxima-foto"
                    type="button"
                >
                    ›
                </button>

                <span
                    class="contador-fotos"
                    id="contador-fotos"
                ></span>

            </div>

            <div
                class="modal-miniaturas"
                id="modal-miniaturas"
            ></div>

        </div>

        <!-- Informações -->
        <div class="modal-informacoes">

            <span
                class="modal-tipo"
                id="modal-tipo"
            ></span>

            <h2 id="modal-titulo"></h2>

            <p
                class="modal-localizacao"
                id="modal-localizacao"
            ></p>

            <div class="modal-caracteristicas">

                <span id="modal-quartos"></span>

                <span id="modal-banheiros"></span>

                <span id="modal-vagas"></span>

                <span id="modal-area"></span>

            </div>

            <p
                class="modal-descricao"
                id="modal-descricao"
            ></p>

            <div class="modal-valor">

                <small>
                    Valor do imóvel
                </small>

                <strong id="modal-preco"></strong>

            </div>

            <a
                class="modal-whatsapp"
                id="modal-whatsapp"
                href="#"
                target="_blank"
            >
                Quero mais informações
            </a>

        </div>

    </div>

</div>
