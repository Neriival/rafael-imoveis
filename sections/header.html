<header class="header">
    <div class="header-container">

        <!-- Logo da imobiliária -->
        <a
            href="#inicio"
            class="logo"
            aria-label="Rafael Dantas Imóveis - Início"
        >
            <img
                src="imagens/logorafael.png"
                alt="Rafael Dantas Imóveis"
                class="logo-imagem"
            >
        </a>

        <!-- Menu de navegação -->
        <nav
            class="menu"
            id="menu"
            aria-label="Menu principal"
        >
            <a href="#inicio">
                Início
            </a>

            <a href="#imoveis">
                Imóveis
            </a>

            <a href="#corretor">
                O corretor
            </a>

            <a href="#contato">
                Contato
            </a>

            <!-- Visível somente no celular -->
            <a
                href="#contato"
                class="menu-whatsapp"
            >
                Falar no WhatsApp
            </a>
        </nav>

        <!-- WhatsApp no computador -->
        <a
            href="#contato"
            class="botao-whatsapp"
        >
            Falar no WhatsApp
        </a>

        <!-- Botão do menu no celular -->
        <button
            class="botao-menu"
            id="botao-menu"
            type="button"
            aria-label="Abrir menu"
            aria-expanded="false"
            aria-controls="menu"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>
</header>
