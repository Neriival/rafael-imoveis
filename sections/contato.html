<!-- ================================
     CONTATO
================================ -->

<section class="secao-contato" id="contato">

    <div class="contato-conteudo">

        <span class="contato-subtitulo">
            ATENDIMENTO PERSONALIZADO
        </span>

        <h2>
            Vamos encontrar o imóvel certo para você?
        </h2>

        <p>
            Conte ao Rafael o que você procura e receba
            oportunidades selecionadas de acordo com suas
            necessidades.
        </p>

        <div class="contato-informacoes">

            <div class="contato-item">

                <span>WhatsApp</span>

                <strong>
                    (13) 99999-9999
                </strong>

            </div>

            <div class="contato-item">

                <span>Localização</span>

                <strong>
                    Praia Grande – SP
                </strong>

            </div>

            <div class="contato-item">

                <span>Atendimento</span>

                <strong>
                    Segunda a sábado
                </strong>

            </div>

        </div>

    </div>


    <!-- Formulário -->
    <form class="formulario-contato" id="formulario-contato">

        <div class="formulario-titulo">

            <span>
                FALE COM O RAFAEL
            </span>

            <h3>
                Como posso ajudar?
            </h3>

        </div>

        <div class="campo-formulario">

            <label for="nome">
                Seu nome
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                required
            >

        </div>

        <div class="campo-formulario">

            <label for="telefone">
                Seu telefone
            </label>

            <input
                type="tel"
                id="telefone"
                placeholder="(13) 99999-9999"
                required
            >

        </div>

        <div class="campo-formulario">

            <label for="interesse">
                Tenho interesse em
            </label>

            <select id="interesse">

                <option value="comprar">
                    Comprar um imóvel
                </option>

                <option value="alugar">
                    Alugar um imóvel
                </option>

                <option value="vender">
                    Vender meu imóvel
                </option>

                <option value="avaliar">
                    Avaliar meu imóvel
                </option>

            </select>

        </div>

        <div class="campo-formulario">

            <label for="mensagem">
                Mensagem
            </label>

            <textarea
                id="mensagem"
                rows="4"
                placeholder="Conte um pouco sobre o que você procura"
            ></textarea>

        </div>

        <button type="submit">
            Enviar pelo WhatsApp
        </button>

    </form>

</section>
